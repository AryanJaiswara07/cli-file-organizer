[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-file-organizer"
version = "1.0.0"
description = "A CLI tool that organizes files into categorized folders by file type"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Aryan Jaiswara", email = "aryanjaiswara69@gmail.com"}
]
keywords = ["cli", "file-organizer", "productivity", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]

[project.scripts]
file-organizer = "organizer:main"

[project.urls]
Homepage = "https://github.com/AryanJaiswara07/cli-file-organizer"
Repository = "https://github.com/AryanJaiswara07/cli-file-organizer"
Issues = "https://github.com/AryanJaiswara07/cli-file-organizer/issues"

[tool.setuptools]
py-modules = ["organizer"]
